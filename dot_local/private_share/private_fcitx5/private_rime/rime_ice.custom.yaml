patch:
  # 按键绑定
  key_binder/bindings/+:
    # 逗号句号翻页（最经典的 Windows 手感）
    - { when: paging,     accept: bracketleft,  send: Page_Up }   # [ 上翻
    - { when: has_menu,   accept: bracketright, send: Page_Down } # ] 下翻

    # Ctrl+, 切换中英文标点
    - { when: always,     accept: Control+comma,  toggle: ascii_punct }
    # Ctrl+. 切换全角/半角
    - { when: always,     accept: Control+period, toggle: full_shape }

    # Esc 清拼音（Windows 习惯：打错了按 Esc 重来）
    - { when: composing, accept: Escape, send: Escape }
  key_binder/select_first_character: ""
  key_binder/select_last_character: ""
