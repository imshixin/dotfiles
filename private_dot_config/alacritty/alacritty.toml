[window]
dimensions = { columns = 80, lines = 24 }
padding = { x = 6, y = 2 }
opacity = 1.0
blur = true
dynamic_title = true

[scrolling]
history = 50000 # 最大滚动行数
multiplier = 3 # 单次滚动行数

[font]
normal = { family = "JetBrainsMonoNerdFont", style = "Regular" }
bold = { family = "JetBrainsMonoNerdFont", style = "bold" }
italic = { family = "JetBrainsMonoNerdFont", style = "italic" }
bold_italic = { family = "JetBrainsMonoNerdFont", style = "bold italic" }
size = 11

[bell]
duration = 1

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[cursor]
style = { shape = "Beam", blinking = "On" }

[terminal]
shell = { program = "/usr/bin/zsh", args = ["-l"] }

[colors.bright]
# https://github.com/alacritty/alacritty-theme
# github_dark
black = "0x6e7681"
blue = "0x79c0ff"
cyan = "0x39c5cf"
green = "0x56d364"
magenta = "0xbc8cff"
red = "0xffa198"
white = "0xb1bac4"
yellow = "0xe3b341"

[colors.cursor]
cursor = "0xe6edf3"
text = "0x30363d"

[colors.normal]
black = "0x484f58"
blue = "0x58a6ff"
cyan = "0x39c5cf"
green = "0x3fb950"
magenta = "0xbc8cff"
red = "0xff7b72"
white = "0xb1bac4"
yellow = "0xd29922"

[colors.primary]
background = "0x30363d"
foreground = "0xe6edf3"


[mouse]
bindings = [
    { mouse = "Right", action = "Paste" }, # 右键粘贴
    { mouse = "Left", mods = "Control", action = "Open" }, # ctrl+左键打开浏览器
]

[keyboard]
bindings = [
    # 复制 (Cmd + C)
    { key = "C", mods = "Command|Shift", action = "Copy" },

    # 粘贴 (Cmd + V)
    { key = "V", mods = "Command|Shift", action = "Paste" },

    # 查找 (Cmd + F)
    { key = "F", mods = "Command", action = "SearchForward" },

    # 新建窗口 (Cmd + N)
    { key = "N", mods = "Command", action = "CreateNewWindow" },

    # 缩小字体 (Cmd + -)
    { key = "Minus", mods = "Command", action = "DecreaseFontSize" },

    # 放大字体 (Cmd + =)
    { key = "Equals", mods = "Command", action = "IncreaseFontSize" },

    # 恢复默认字体大小 (Cmd + 0)
    { key = "Key0", mods = "Command", action = "ResetFontSize" },

    # 切换全屏 (Cmd + Enter)
    { key = "Return", mods = "Command", action = "ToggleSimpleFullscreen" },

    # 切换到具体标签页 (Cmd + 1 ~ Cmd + 9)
    { key = "Key1", mods = "Command", action = "SelectTab1" },
    { key = "Key2", mods = "Command", action = "SelectTab2" },
    { key = "Key3", mods = "Command", action = "SelectTab3" },
    { key = "Key4", mods = "Command", action = "SelectTab4" },
    { key = "Key5", mods = "Command", action = "SelectTab5" },
    { key = "Key6", mods = "Command", action = "SelectTab6" },
    { key = "Key7", mods = "Command", action = "SelectTab7" },
    { key = "Key8", mods = "Command", action = "SelectTab8" },
    { key = "Key9", mods = "Command", action = "SelectTab9" },

    # 隐藏 Alacritty (Cmd + H)
    { key = "H", mods = "Command", action = "Hide" },

    # 隐藏其他应用 (Cmd + Option + H)
    { key = "H", mods = "Command|Option", action = "HideOtherApplications" },
]

